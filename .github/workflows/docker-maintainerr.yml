name: Build Maintainerr Integration Image

on:
  push:
    branches:
      - feat/maintainerr-integration
  workflow_dispatch:

concurrency:
  group: maintainerr-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=maintainerr
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/arr-dashboard:maintainerr
            ghcr.io/${{ github.repository_owner }}/arr-dashboard:maintainerr-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
